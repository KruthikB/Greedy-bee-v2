<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Greedy Bee</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <div class="app">

    <header>
      <div class="logo">💧</div>
      <div class="app-name">Greedy Bee</div>
      <div class="tagline">Stay hydrated. Stay sharp.</div>
    </header>

    <!-- Status card -->
    <div class="card">
      <div id="status-badge" class="badge badge-running">● Running</div>
      <div id="countdown-label" class="countdown">Next reminder in —:——</div>
    </div>

    <!-- Interval control -->
    <div class="card">
      <label class="section-label">Remind me every</label>
      <div class="row">
        <input id="interval-input" type="number" min="1" max="240" value="15" />
        <span class="unit">minutes</span>
        <button id="apply-btn" class="btn btn-primary">Apply</button>
      </div>
    </div>

    <!-- Pause controls -->
    <div class="card">
      <label class="section-label">Pause reminders</label>
      <div class="row wrap">
        <button class="btn btn-secondary" data-pause="30">30 min</button>
        <button class="btn btn-secondary" data-pause="60">1 hour</button>
        <button class="btn btn-secondary" data-pause="120">2 hours</button>
        <button class="btn btn-secondary" data-pause="0">Indefinitely</button>
      </div>
      <button id="resume-btn" class="btn btn-accent" disabled>Resume Now</button>
    </div>

    <!-- Test + Quit -->
    <div class="card actions-row">
      <button id="test-btn" class="btn btn-ghost">Test Reminder Now</button>
      <button id="quit-btn" class="btn btn-danger">Quit Greedy Bee</button>
    </div>

  </div>
  <script src="settings.js"></script>
</body>
</html>
