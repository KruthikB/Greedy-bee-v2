<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Greedy Bee local character test</title>
  <style>
    html, body { margin: 0; height: 100%; background: linear-gradient(180deg, #1b4332, #40916c); font-family: Segoe UI, sans-serif; color: #fff; }
    #hud { position: fixed; top: 12px; left: 12px; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; max-width: 90%; }
    button { padding: 8px 12px; font-size: 13px; }
    #status { opacity: .85; }
    #stage { position: fixed; left: 0; bottom: 70px; height: 300px; width: auto; }
    #character-canvas { height: 300px; width: auto; display: block; background: transparent; }
    #strip { position: fixed; left: 0; right: 0; bottom: 0; height: 70px; display: none; align-items: center; padding: 0 24px; gap: 12px; }
    #strip.visible { display: flex; }
    .label { background: rgba(0,0,0,.67); border-radius: 10px; padding: 8px 16px; font-weight: bold; }
  </style>
</head>
<body>
  <div id="hud">
    <button id="play">Play Kaybie (drink)</button>
    <span id="status">idle</span>
  </div>
  <div id="stage"><canvas id="character-canvas"></canvas></div>
  <div id="strip"><span class="label" id="q">Did you remember to drink water?</span></div>
  <script>
    const canvas = document.getElementById('character-canvas');
    const ctx = canvas.getContext('2d', { alpha: true });
    const strip = document.getElementById('strip');
    const status = document.getElementById('status');

    async function playVideo(character, action) {
      const base = `../assets/characters/${character}/${action}`;
      const manifest = await fetch(`${base}/manifest.json`).then(r => {
        if (!r.ok) throw new Error('Missing frames — run scripts\\process_video.bat');
        return r.json();
      });
      const frames = await Promise.all(Array.from({ length: manifest.frameCount }, (_, i) => {
        const img = new Image();
        img.src = `${base}/frame_${String(i + 1).padStart(4, '0')}.webp`;
        return new Promise((res, rej) => { img.onload = () => res(img); img.onerror = rej; });
      }));
      const W = frames[0].naturalWidth;
      const H = frames[0].naturalHeight;
      canvas.width = W;
      canvas.height = H;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      const ms = Math.round(1000 / (manifest.fps || 12));
      for (let i = 0; i < frames.length; i++) {
        ctx.clearRect(0, 0, W, H);
        ctx.drawImage(frames[i], 0, 0);
        await new Promise(r => setTimeout(r, ms));
      }
    }

    document.getElementById('play').onclick = async () => {
      strip.classList.remove('visible');
      status.textContent = 'playing water-guy/drink';
      try {
        await playVideo('water-guy', 'drink');
        strip.classList.add('visible');
        status.textContent = 'done';
      } catch (err) {
        status.textContent = String(err);
        console.error(err);
      }
    };
  </script>
</body>
</html>
