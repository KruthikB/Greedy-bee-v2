name: Build Greedy Bee v2

# Triggers: push to main, or manually from the GitHub Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7

      # ── 2. Rust toolchain ──────────────────────────────────────────
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # ── 3. Cache Rust build artifacts (makes 2nd+ builds fast) ────
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # ── 4. Tauri CLI — pre-built binary, fast (~30s vs 15min) ─────
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        run: cargo binstall tauri-cli@^2 --no-confirm

      # ── 5. FFmpeg (not preinstalled on windows-latest) ────────────
      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -eq 3010) { exit 0 }
          exit $LASTEXITCODE

      # ── 6. Convert green-screen video → transparent WebP frames ──
      #    WebView2 will not paint alpha <video>/WebM on a transparent window.
      #    PNG/WebP frames on a canvas do paint. Chromakey runs once here only.
      - name: Convert character video (green screen → WebP frames)
        shell: pwsh
        run: |
          if (-not (Test-Path "assets/character.mp4")) {
            Write-Error "assets/character.mp4 is missing."
            exit 1
          }
          $framesDir = "frontend/assets/frames"
          New-Item -ItemType Directory -Force -Path $framesDir | Out-Null
          Remove-Item -Force "$framesDir/*" -ErrorAction SilentlyContinue
          ffmpeg `
            -y `
            -i assets/character.mp4 `
            -vf "chromakey=0x31A638:similarity=0.12:blend=0.08,format=rgba,scale=-1:300,fps=12" `
            -c:v libwebp -lossless 0 -compression_level 4 -q:v 55 -an `
            "$framesDir/frame_%04d.webp"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $count = (Get-ChildItem "$framesDir/frame_*.webp").Count
          if ($count -lt 1) {
            Write-Error "ffmpeg produced no character frames."
            exit 1
          }
          @{ frameCount = $count; fps = 12 } | ConvertTo-Json | Set-Content -Encoding utf8 "$framesDir/manifest.json"
          Write-Host "Generated $count character frames."

      # ── 7. Build the Tauri app ────────────────────────────────────
      - name: Build Greedy Bee
        shell: pwsh
        run: |
          $missing = @("src-tauri/icons/icon.ico", "src-tauri/icons/icon.png") | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Error ("Missing icon files: " + ($missing -join ", "))
            exit 1
          }
          cargo tauri build

      # ── 8. Upload the installer as a downloadable artifact ────────
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: GreedyBee-v2-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 90
